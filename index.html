<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#101426">
<title>浮光画布 LumaCanvas</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div id="stage">
  <canvas id="bgCanvas"></canvas>
  <canvas id="fxCanvas"></canvas>
  <div id="hint">
    <span class="hint-title">✨ 点按任意位置</span>
    <span class="hint-sub">点下方按钮自定义特效</span>
  </div>
</div>

<button id="fab" aria-label="打开特效设置">✨</button>

<div id="panel" class="hidden" role="dialog" aria-label="特效设置" aria-modal="false">
  <div class="panel-head">
    <span class="panel-title">特效设置</span>
    <button id="collapseBtn" aria-label="收起设置">▾</button>
  </div>

  <section>
    <h2>点击特效</h2>
    <div id="fxList" class="chips"></div>
    <div id="fxParams" class="params"></div>
  </section>

  <section>
    <h2>背景颜色</h2>
    <div id="colorList" class="swatches"></div>
  </section>

  <section>
    <h2>背景特效</h2>
    <div id="bgList" class="chips"></div>
    <div id="bgParams" class="params"></div>
  </section>

  <section>
    <h2>滑动特效</h2>
    <div id="swipeList" class="chips"></div>
    <div id="swipeParams" class="params"></div>
  </section>

  <a class="panel-foot" href="https://github.com/oksummer/LumaCanvas" target="_blank" rel="noopener noreferrer">
    <svg class="gh" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
    反馈 | 联系作者
  </a>
</div>

<script src="./fx.js"></script>
<script src="./bg.js"></script>
<script src="./app.js"></script>
</body>
</html>
